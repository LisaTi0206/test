<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天使魔法密數</title>
<meta name="description" content="輸入英文名字，推算屬於你的天使魔法密數。">
<style>
:root{
  --bg:#100e26;
  --bg2:#1c1940;
  --card:rgba(26,23,56,.88);
  --gold:#e6c67f;
  --gold-deep:#b98f3f;
  --ink:#f6eedc;
  --mute:#b8b1cf;
  --line:rgba(230,198,127,.35);
  --err:#ffb4a8;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color:var(--ink);
  line-height:1.8;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,255,255,.75),transparent),
    radial-gradient(1px 1px at 78% 12%,rgba(255,255,255,.6),transparent),
    radial-gradient(1.5px 1.5px at 90% 40%,rgba(255,255,255,.5),transparent),
    radial-gradient(1px 1px at 30% 55%,rgba(255,255,255,.55),transparent),
    radial-gradient(1.5px 1.5px at 62% 78%,rgba(255,255,255,.5),transparent),
    radial-gradient(1px 1px at 8% 88%,rgba(255,255,255,.6),transparent),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 55%,#2b2250 100%);
  min-height:100vh;
}
.wrap{max-width:640px;margin:0 auto;padding:36px 16px 56px}

/* ---- 標題區 ---- */
.hero{text-align:center}
.arches{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
  max-width:540px;margin:0 auto 28px;
}
.arches img{
  display:block;width:100%;aspect-ratio:2/3;object-fit:cover;object-position:50% 14%;
  border-radius:999px 999px 10px 10px;
  border:1px solid var(--line);
  box-shadow:0 8px 22px rgba(0,0,0,.45);
}
.arches img:nth-child(even){margin-top:14px}
h1{
  margin:0;font-size:clamp(30px,8vw,42px);letter-spacing:.14em;font-weight:700;
  font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;
  color:var(--gold);
  text-shadow:0 2px 18px rgba(230,198,127,.35);
}
.sub{margin:8px 0 0;color:var(--mute);font-size:16px;letter-spacing:.08em}
.divider{width:64px;height:1px;margin:20px auto 0;background:var(--gold-deep)}

/* ---- 輸入卡 ---- */
.card{
  margin-top:28px;padding:26px 22px;
  background:var(--card);
  border:1px solid var(--line);border-radius:20px;
  box-shadow:0 14px 40px rgba(0,0,0,.4);
}
label{display:block;font-weight:700;margin:0 0 6px}
label + input,label + select{margin-bottom:18px}
input,select,button{
  width:100%;padding:14px;font-size:18px;font-family:inherit;
  border-radius:12px;
}
input,select{
  border:1px solid rgba(230,198,127,.45);
  background:#f8f2e4;color:#241f3d;
}
input::placeholder{color:#8c86a3}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{
  outline:3px solid var(--gold);outline-offset:2px;
}
button.primary{
  border:none;cursor:pointer;font-weight:700;letter-spacing:.1em;
  background:linear-gradient(180deg,#f0d78f,#c99a45);color:#2b2140;
  margin-top:4px;
}
button.primary:hover{filter:brightness(1.06)}
.hint{margin:10px 0 0;color:var(--mute);font-size:14px}
.error{margin:14px 0 0;color:var(--err);font-weight:700;min-height:1.8em}

/* ---- 結果 ---- */
#result{margin-top:28px}
.reveal{
  display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:center;
  padding:22px;
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  box-shadow:0 14px 40px rgba(0,0,0,.4);
  animation:rise .6s ease both;
}
.reveal .art{
  margin:0;aspect-ratio:4/5;overflow:hidden;
  border-radius:999px 999px 12px 12px;border:1px solid var(--line);
}
.reveal .art img{width:100%;height:100%;object-fit:cover;object-position:46% 20%;display:block}
.reveal .tag{color:var(--mute);letter-spacing:.12em;font-size:15px}
.reveal .num{
  font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;
  font-size:clamp(84px,24vw,128px);line-height:1.05;font-weight:700;
  color:var(--gold);text-shadow:0 0 28px rgba(230,198,127,.5);
}
.reveal .cap{font-size:17px}

.meaning{
  margin-top:16px;padding:18px 20px;border-left:5px solid var(--gold-deep);
  background:rgba(255,248,232,.07);border-radius:10px;font-size:18px;white-space:pre-line;
  animation:rise .6s .1s ease both;
}

.calc{
  margin-top:16px;padding:22px;
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  animation:rise .6s .15s ease both;
}
.calc h2{margin:0 0 12px;font-size:17px;color:var(--gold);letter-spacing:.1em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 16px}
.chip{
  min-width:34px;padding:2px 6px;text-align:center;line-height:1.3;
  border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.05);
}
.chip b{display:block;font-size:17px;font-family:"Noto Serif TC",serif}
.chip span{display:block;font-size:15px;color:var(--gold)}
.row{margin:0 0 10px;font-size:18px;overflow-wrap:anywhere}
.row small{display:block;color:var(--mute);font-size:14px}
.eq{font-variant-numeric:tabular-nums;letter-spacing:.02em}
button.ghost{
  margin-top:8px;width:auto;padding:8px 16px;font-size:15px;cursor:pointer;
  background:transparent;color:var(--gold);border:1px solid var(--line);
}
button.ghost:hover{background:rgba(230,198,127,.1)}

details{
  margin-top:20px;padding:14px 18px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
}
summary{cursor:pointer;font-weight:700;color:var(--gold);letter-spacing:.08em}
table{width:100%;border-collapse:collapse;margin-top:14px;text-align:center}
th,td{border:1px solid var(--line);padding:4px 2px}
th{color:var(--gold);font-family:"Noto Serif TC",serif}
td{font-family:"Noto Serif TC",serif;font-size:18px;vertical-align:top}

.footer{margin-top:36px;text-align:center;color:var(--mute);font-size:15px}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal,.meaning,.calc{animation:none}}
@media (max-width:420px){
  .card,.calc,.reveal{padding:18px 16px}
  .reveal{gap:12px}
}
</style>
</head>
<body>
<main class="wrap">

  <header class="hero">
    <div class="arches" id="arches" aria-hidden="true"></div>
    <h1>天使魔法密數</h1>
    <p class="sub">輸入你的英文名字，揭曉屬於你的魔法密數</p>
    <div class="divider"></div>
  </header>

  <form class="card" id="form" novalidate>
    <label for="name">✨ 英文名字</label>
    <input id="name" type="text" autocomplete="off" autocapitalize="characters"
           placeholder="例如：LISA TI 或 LI,KAI-CHAN" aria-describedby="hint err">

    <label for="purpose">🕊️ 魔法目的</label>
    <select id="purpose"></select>

    <button class="primary" type="submit">🔮 揭曉魔法密數</button>
    <p class="hint" id="hint">空格、逗號、連字號會自動忽略。</p>
    <p class="error" id="err" role="alert"></p>
  </form>

  <section id="result" aria-live="polite" hidden></section>

  <details>
    <summary>字母對應表</summary>
    <table id="lettertable"></table>
  </details>

  <div class="footer">美波 Maple・和煦心靈訪談所<br>All Rights Reserved.</div>
</main>

<script>
/* ============================================================
   設定區：之後要新增圖片或新的魔法目的，只需要改這裡
   ============================================================ */

/* 字母對應數字（來自對照表） */
const LETTERS = {
  1:"AIQJY", 2:"BKR", 3:"CGLS", 4:"DMT",
  5:"EHN",   6:"UVWX", 7:"OZ",  8:"FP"
};

/* 魔法目的：下拉選單的選項。
   word     = 該目的的英文關鍵字，程式會用對照表自動算出它的數字（PROTECT = 33）
   img      = 結果頁顯示的天使圖
   meanings = 各個密數（1～9）的解讀文字，先留空，之後填入即可顯示 */
const PURPOSES = [
  {
    id: "protect",
    label: "守護",
    word: "PROTECT",
    img: "images/angel-5.jpg",
    meanings: { 1:"", 2:"", 3:"", 4:"", 5:"", 6:"", 7:"", 8:"", 9:"" }
  }
  /* 新增範例：
  ,{ id:"heal", label:"療癒", word:"HEAL", img:"images/angel-4.jpg", meanings:{} }
  */
];

/* 標題區的天使拱門圖（想加圖就加一行路徑；排版是 5 張一排） */
const HERO_IMAGES = [
  "images/angel-6.jpg",
  "images/angel-2.jpg",
  "images/angel-5.jpg",
  "images/angel-3.jpg",
  "images/angel-7.jpg"
];

/* ============================================================
   計算
   ============================================================ */
const MAP = {};
for (const [n, letters] of Object.entries(LETTERS)) {
  for (const ch of letters) MAP[ch] = Number(n);
}

const digitsOf = n => String(n).split("").map(Number);
const add = arr => arr.reduce((a, b) => a + b, 0);

/* 英文字串 → 字母陣列與對應數字 */
function lettersToNumbers(word) {
  const chars = word.split("");
  return { chars, nums: chars.map(c => MAP[c]) };
}

/* 第二行：把關鍵字總和與名字總和的每個位數拆開加總，
   若結果是兩位數以上，就繼續拆開加總到個位數 */
function reduceToSingle(keywordSum, nameSum) {
  let digits = digitsOf(keywordSum).concat(digitsOf(nameSum));
  let total = add(digits);
  const steps = [digits.join("+") + "=" + total];
  while (total > 9) {
    digits = digitsOf(total);
    total = add(digits);
    steps.push(digits.join("+") + "=" + total);
  }
  return { steps, final: total };
}

/* 清理輸入：全形轉半形、轉大寫、移除空格與常見符號 */
function cleanName(raw) {
  return raw.normalize("NFKC").toUpperCase().replace(/[\s,.\-_'’·]/g, "");
}

function compute(rawName, purpose) {
  const name = cleanName(rawName);
  if (!name) return { error: "請輸入英文名字。" };
  if (/[^A-Z]/.test(name)) return { error: "請只輸入英文字母（空格、逗號、連字號可以保留）。" };

  const kw = lettersToNumbers(purpose.word);
  const nm = lettersToNumbers(name);
  const keywordSum = add(kw.nums);
  const nameSum = add(nm.nums);
  const { steps, final } = reduceToSingle(keywordSum, nameSum);
  return { name, kw, nm, keywordSum, nameSum, steps, final };
}

/* ============================================================
   畫面
   ============================================================ */
const $ = id => document.getElementById(id);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function chipsFor(part) {
  const box = el("div", "chips");
  part.chars.forEach((c, i) => {
    const chip = el("div", "chip");
    chip.append(el("b", "", c), el("span", "", String(part.nums[i])));
    box.append(chip);
  });
  return box;
}

function eq(nums, sum) { return nums.join("+") + "=" + sum; }

function render(purpose, r, rawName) {
  const box = $("result");
  box.replaceChildren();

  /* 揭曉區 */
  const reveal = el("div", "reveal");
  const fig = el("figure", "art");
  const img = el("img");
  img.src = purpose.img; img.alt = "";
  fig.append(img);
  const side = el("div");
  side.append(
    el("div", "tag", purpose.label + " · " + purpose.word),
    el("div", "num", String(r.final)),
    el("div", "cap", "你的" + purpose.label + "魔法密數")
  );
  reveal.append(fig, side);
  box.append(reveal);

  /* 解讀（有填才顯示） */
  const meaning = purpose.meanings && purpose.meanings[r.final];
  if (meaning) box.append(el("div", "meaning", meaning));

  /* 計算過程 */
  const calc = el("div", "calc");
  calc.append(el("h2", "", "計算過程"));

  calc.append(el("div", "row", "你的名字：" + r.name));
  calc.append(chipsFor(r.nm));

  const line1 = el("p", "row");
  line1.append(el("small", "", "第一行｜名字的字母數字加總"));
  line1.append(el("span", "eq", eq(r.nm.nums, r.nameSum)));
  calc.append(line1);

  const kwRow = el("p", "row");
  kwRow.append(el("small", "", purpose.label + "（" + purpose.word + "）的關鍵數字"));
  kwRow.append(el("span", "eq", eq(r.kw.nums, r.keywordSum)));
  calc.append(kwRow);

  const line2 = el("p", "row");
  line2.append(el("small", "", "第二行｜" + r.keywordSum + " 與 " + r.nameSum + " 的每個位數拆開加總，直到個位數"));
  line2.append(el("span", "eq", r.steps.join("，")));
  calc.append(line2);

  const copy = el("button", "ghost", "複製結果");
  copy.type = "button";
  copy.addEventListener("click", () => {
    const text = r.name + "｜" + purpose.label + "魔法密數：" + r.final + "\n" +
      eq(r.nm.nums, r.nameSum) + "\n" + r.steps.join("，");
    const done = () => { copy.textContent = "已複製 ✓"; setTimeout(() => copy.textContent = "複製結果", 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => {});
    }
  });
  calc.append(copy);
  box.append(calc);

  box.hidden = false;
  box.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ---- 初始化 ---- */
HERO_IMAGES.forEach(src => {
  const i = el("img"); i.src = src; i.alt = ""; $("arches").append(i);
});

PURPOSES.forEach(p => {
  const o = el("option", "", p.label + "（" + p.word + "）");
  o.value = p.id;
  $("purpose").append(o);
});

/* 字母對應表 */
(function buildTable() {
  const t = $("lettertable");
  const head = el("tr"), body = el("tr");
  for (const [n, letters] of Object.entries(LETTERS)) {
    head.append(el("th", "", n));
    const td = el("td");
    td.innerHTML = letters.split("").join("<br>"); /* 僅含固定字母，無外部輸入 */
    body.append(td);
  }
  t.append(head, body);
})();

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const purpose = PURPOSES.find(p => p.id === $("purpose").value);
  const raw = $("name").value;
  const r = compute(raw, purpose);
  if (r.error) {
    $("err").textContent = r.error;
    $("result").hidden = true;
    return;
  }
  $("err").textContent = "";
  render(purpose, r, raw);
});
</script>
</body>
</html>
