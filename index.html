<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天使魔法密數</title>
<meta name="description" content="輸入英文名字，推算屬於你的天使魔法密數。">
<style>
:root{
  --bg:#100e26;
  --bg2:#1c1940;
  --card:rgba(26,23,56,.88);
  --gold:#e6c67f;
  --gold-deep:#b98f3f;
  --ink:#f6eedc;
  --mute:#b8b1cf;
  --line:rgba(230,198,127,.35);
  --err:#ffb4a8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color:var(--ink);
  line-height:1.8;
  background:
    radial-gradient(ellipse 70% 360px at 50% 0,rgba(230,198,127,.16),transparent),
    radial-gradient(1.5px 1.5px at 12% 18%,rgba(255,255,255,.75),transparent),
    radial-gradient(1px 1px at 78% 12%,rgba(255,255,255,.6),transparent),
    radial-gradient(1.5px 1.5px at 90% 40%,rgba(255,255,255,.5),transparent),
    radial-gradient(1px 1px at 30% 55%,rgba(255,255,255,.55),transparent),
    radial-gradient(1.5px 1.5px at 62% 78%,rgba(255,255,255,.5),transparent),
    radial-gradient(1px 1px at 8% 88%,rgba(255,255,255,.6),transparent),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 55%,#2b2250 100%);
  background-color:var(--bg);
  min-height:100vh;
}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:36px 16px 48px}

/* ---- 刊頭：單張主視覺 ---- */
.hero{text-align:center}
.crest{
  position:relative;width:min(240px,62vw);margin:0 auto 26px;
}
.crest::before{ /* 外圈細拱線 */
  content:"";position:absolute;inset:-9px;
  border:1px solid var(--line);border-radius:999px 999px 18px 18px;
}
.crest img{
  display:block;width:100%;aspect-ratio:5/6;object-fit:cover;object-position:46% 18%;
  border-radius:999px 999px 12px 12px;
  border:1px solid var(--gold-deep);
  box-shadow:0 0 60px rgba(230,198,127,.32),0 12px 30px rgba(0,0,0,.45);
}
h1{
  margin:0;font-size:clamp(30px,8vw,42px);letter-spacing:.14em;font-weight:700;
  font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;
  color:var(--gold);
  text-shadow:0 2px 18px rgba(230,198,127,.35);
}
.sub{margin:8px 0 0;color:var(--mute);font-size:16px;letter-spacing:.08em}
.divider{width:64px;height:1px;margin:20px auto 0;background:var(--gold-deep)}

/* ---- 輸入卡 ---- */
.card{
  margin-top:28px;padding:26px 22px;
  background:var(--card);
  border:1px solid var(--line);border-radius:20px;
  box-shadow:0 14px 40px rgba(0,0,0,.4);
}
label{display:block;font-weight:700;margin:0 0 6px}
label + input,label + select{margin-bottom:18px}
input,select,button{
  width:100%;padding:14px;font-size:18px;font-family:inherit;
  border-radius:12px;
}
input,select{
  border:1px solid rgba(230,198,127,.45);
  background:#f8f2e4;color:#241f3d;
}
input::placeholder{color:#8c86a3}
input:focus-visible,select:focus-visible,button:focus-visible{
  outline:3px solid var(--gold);outline-offset:2px;
}
button.primary{
  border:none;cursor:pointer;font-weight:700;letter-spacing:.1em;
  background:linear-gradient(180deg,#f0d78f,#c99a45);color:#2b2140;
  margin-top:4px;
}
button.primary:hover{filter:brightness(1.06)}
.hint{margin:10px 0 0;color:var(--mute);font-size:14px}
.error{margin:14px 0 0;color:var(--err);font-weight:700;min-height:1.8em}

/* ---- 結果：太陽徽章 ---- */
#result{margin-top:28px}
.reveal{
  padding:30px 22px 28px;text-align:center;
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  box-shadow:0 14px 40px rgba(0,0,0,.4);
  animation:rise .6s ease both;
}
.reveal .tag{color:var(--mute);letter-spacing:.14em;font-size:15px}
.medal{
  width:min(210px,62vw);aspect-ratio:1;margin:18px auto 16px;
  display:grid;place-items:center;border-radius:50%;
  border:1px solid var(--gold);
  background:radial-gradient(circle at 50% 38%,rgba(230,198,127,.30),rgba(230,198,127,.06) 70%);
  box-shadow:
    0 0 0 8px rgba(230,198,127,.07),
    0 0 0 9px var(--line),
    0 0 54px rgba(230,198,127,.38);
}
.medal .num{
  font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;
  font-size:clamp(96px,26vw,124px);line-height:1;font-weight:700;
  color:var(--gold);text-shadow:0 0 26px rgba(230,198,127,.55);
}
.reveal .cap{font-size:18px;letter-spacing:.06em}

/* ---- 裝飾：寬螢幕時放在內容兩側 ---- */
.deco{
  position:absolute;top:300px;z-index:0;
  display:none;flex-direction:column;gap:24px;width:168px;pointer-events:none;
}
.deco.left{right:calc(100% + 20px)}
.deco.right{left:calc(100% + 20px);top:440px}
.arch{
  display:block;width:100%;aspect-ratio:2/3;object-fit:cover;object-position:50% 14%;
  border-radius:999px 999px 12px 12px;
  border:1px solid var(--line);
  opacity:.88;
  box-shadow:0 10px 26px rgba(0,0,0,.45);
  animation:float 7s ease-in-out infinite;
}
.deco .arch:nth-child(2){animation-delay:-3.5s}
@media (min-width:1100px){.deco{display:flex}}

/* ---- 頁尾：滿版大圖 ---- */
.finale{
  position:relative;isolation:isolate;overflow:hidden;
  margin-top:8px;min-height:clamp(520px,130vw,760px);
  display:flex;align-items:flex-end;justify-content:center;
}
.finale img{
  position:absolute;inset:0;z-index:-2;width:100%;height:100%;
  object-fit:cover;object-position:50% 24%;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 30%);
          mask-image:linear-gradient(180deg,transparent 0,#000 30%);
}
@media (min-width:900px){
  .finale img{ /* 寬螢幕：限制放大倍率，左右淡出到背景 */
    left:50%;right:auto;width:min(100%,1060px);transform:translateX(-50%);
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 30%),linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 30%),linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%);
    -webkit-mask-composite:source-in;
            mask-composite:intersect;
  }
}
.finale::after{ /* 底部壓暗，讓署名好讀 */
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,transparent 55%,rgba(16,14,38,.55) 82%,rgba(16,14,38,.9) 100%);
}
.footer{
  padding:0 16px 32px;text-align:center;color:#e9e3f7;font-size:15px;
  text-shadow:0 1px 12px rgba(0,0,0,.7);
}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}.arch{animation:none}}
@media (max-width:420px){
  .card,.reveal{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>

<main class="wrap">

  <div class="deco left" id="decoLeft" aria-hidden="true"></div>
  <div class="deco right" id="decoRight" aria-hidden="true"></div>

  <header class="hero">
    <div class="crest"><img src="images/angel-5.jpg" alt="大天使麥可"></div>
    <h1>天使魔法密數</h1>
    <p class="sub">輸入你的英文名字，揭曉屬於你的魔法密數</p>
    <div class="divider"></div>
  </header>

  <form class="card" id="form" novalidate>
    <label for="name">✨ 英文名字</label>
    <input id="name" type="text" autocomplete="off" autocapitalize="characters"
           placeholder="輸入護照上的英文名" aria-describedby="hint err">

    <label for="purpose">🕊️ 魔法目的</label>
    <select id="purpose"></select>

    <button class="primary" type="submit">🔮 揭曉魔法密數</button>
    <p class="hint" id="hint">空格、逗號、連字號會自動忽略。</p>
    <p class="error" id="err" role="alert"></p>
  </form>

  <section id="result" aria-live="polite" hidden></section>

</main>

<section class="finale">
  <img src="images/angel-7.jpg" alt="">
  <div class="footer">美波 Maple・和煦心靈訪談所<br>All Rights Reserved.</div>
</section>

<script>
/* ============================================================
   設定區：之後要新增魔法目的或換裝飾圖，只需要改這裡
   ============================================================ */

/* 字母對應數字 */
const LETTERS = {
  1:"AIQJY", 2:"BKR", 3:"CGLS", 4:"DMT",
  5:"EHN",   6:"UVWX", 7:"OZ",  8:"FP"
};

/* 魔法目的（下拉選單）。word = 該目的的英文關鍵字，程式會自動算出它的數字（PROTECT = 33） */
const PURPOSES = [
  { id: "protect", label: "守護", word: "PROTECT" }
  /* 新增範例：,{ id:"heal", label:"療癒", word:"HEAL" } */
];

/* 裝飾用的大天使麥可圖：寬螢幕放在內容兩側。頁尾滿版大圖在 HTML 的 .finale 裡換 */
const DECO_LEFT  = ["images/angel-6.jpg", "images/angel-1.jpg"];
const DECO_RIGHT = ["images/angel-2.jpg"];

/* ============================================================
   計算
   ============================================================ */
const MAP = {};
for (const [n, letters] of Object.entries(LETTERS)) {
  for (const ch of letters) MAP[ch] = Number(n);
}

const digitsOf = n => String(n).split("").map(Number);
const add = arr => arr.reduce((a, b) => a + b, 0);
const wordSum = word => add(word.split("").map(c => MAP[c]));

/* 關鍵字總和與名字總和，每個位數拆開加總，若仍是兩位數以上就繼續拆到個位數 */
function magicNumber(keywordSum, nameSum) {
  let total = add(digitsOf(keywordSum).concat(digitsOf(nameSum)));
  while (total > 9) total = add(digitsOf(total));
  return total;
}

/* 清理輸入：全形轉半形、轉大寫、移除空格與常見符號 */
function cleanName(raw) {
  return raw.normalize("NFKC").toUpperCase().replace(/[\s,.\-_'’·]/g, "");
}

function compute(rawName, purpose) {
  const name = cleanName(rawName);
  if (!name) return { error: "請輸入英文名字。" };
  if (/[^A-Z]/.test(name)) return { error: "請只輸入英文字母（空格、逗號、連字號可以保留）。" };
  return { final: magicNumber(wordSum(purpose.word), wordSum(name)) };
}

/* ============================================================
   畫面
   ============================================================ */
const $ = id => document.getElementById(id);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function arch(src) {
  const i = el("img", "arch"); i.src = src; i.alt = ""; return i;
}

function render(purpose, r) {
  const box = $("result");
  const reveal = el("div", "reveal");
  const medal = el("div", "medal");
  medal.append(el("div", "num", String(r.final)));
  reveal.append(
    el("div", "tag", purpose.label + " · " + purpose.word),
    medal,
    el("div", "cap", "你的" + purpose.label + "魔法密數")
  );
  box.replaceChildren(reveal);
  box.hidden = false;
  box.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ---- 初始化 ---- */
DECO_LEFT.forEach(s => $("decoLeft").append(arch(s)));
DECO_RIGHT.forEach(s => $("decoRight").append(arch(s)));

PURPOSES.forEach(p => {
  const o = el("option", "", p.label + "（" + p.word + "）");
  o.value = p.id;
  $("purpose").append(o);
});

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const purpose = PURPOSES.find(p => p.id === $("purpose").value);
  const r = compute($("name").value, purpose);
  if (r.error) {
    $("err").textContent = r.error;
    $("result").hidden = true;
    return;
  }
  $("err").textContent = "";
  render(purpose, r);
});
</script>
</body>
</html>
