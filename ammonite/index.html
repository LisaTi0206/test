<style>
  /* Layout: full-bleed specimen stage; title top-left, control tray bottom-left, hint bottom-right. */
  :root {
    --velvet-hi: #5b2f86;
    --velvet-lo: #180c2b;
    --ink: #f3ecff;
    --ink-dim: #b9a9d6;
    --nacre: #9fe8d4;
    --tray: rgba(24, 12, 43, 0.62);
    --tray-line: rgba(200, 175, 240, 0.28);
    --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--velvet-lo); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
  #stage {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 42%, var(--velvet-hi) 0%, #3a1c5c 38%, var(--velvet-lo) 100%);
    touch-action: none;
  }
  #stage[data-bg="black"] { background: radial-gradient(ellipse at 50% 42%, #2a2630 0%, #0a090c 100%); }
  #stage[data-bg="grey"]  { background: radial-gradient(ellipse at 50% 42%, #dcd8e2 0%, #8d8896 100%); }
  canvas { display: block; width: 100%; height: 100%; outline: none; cursor: grab; }
  canvas:active { cursor: grabbing; }

  .title {
    position: fixed; top: max(16px, env(safe-area-inset-top, 0px)); left: 16px; right: 16px;
    pointer-events: none; display: flex; flex-direction: column; gap: 2px;
    text-shadow: 0 1px 12px rgba(10, 4, 24, 0.7);
  }
  .title h1 { margin: 0; font: 600 1.35rem/1.25 var(--font-display); letter-spacing: 0.06em; }
  .title p { margin: 0; font-size: 0.8rem; color: var(--ink-dim); letter-spacing: 0.04em; }

  .tray {
    position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 10px 12px; width: fit-content; max-width: calc(100% - 32px); box-sizing: border-box;
    background: var(--tray); border: 1px solid var(--tray-line); border-radius: 10px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .tray button {
    font: 500 0.8rem var(--font-body); color: var(--ink); background: transparent;
    border: 1px solid var(--tray-line); border-radius: 6px; padding: 6px 12px; cursor: pointer;
    letter-spacing: 0.04em;
  }
  .tray button:hover { border-color: var(--nacre); }
  .tray button[aria-pressed="true"] { background: var(--nacre); color: #14312b; border-color: var(--nacre); }
  .tray button:focus-visible, .tray input:focus-visible { outline: 2px solid var(--nacre); outline-offset: 2px; }
  .tray label { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--ink-dim); }
  .tray input[type="range"] { width: 96px; accent-color: var(--nacre); }


  .lights {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: 264px; box-sizing: border-box; max-height: calc(100% - 120px); overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px; padding: 12px 14px 14px;
    background: var(--tray); border: 1px solid var(--tray-line); border-radius: 10px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 0.8rem; color: var(--ink-dim);
  }
  [hidden] { display: none !important; }
  .lights h2 { margin: 0; font: 500 0.75rem var(--font-body); letter-spacing: 0.14em; color: var(--ink); }
  .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .swatches button, .lights .plain {
    font: 500 0.8rem var(--font-body); color: var(--ink); background: transparent; letter-spacing: 0.04em;
    border: 1px solid var(--tray-line); border-radius: 6px; padding: 6px 4px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .swatches button small { font-size: 0.65rem; color: var(--ink-dim); letter-spacing: 0.02em; }
  .swatches i { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.45); }
  .swatches button:hover, .lights .plain:hover { border-color: var(--nacre); }
  .swatches button[aria-pressed="true"] { border-color: var(--nacre); box-shadow: 0 0 0 1px var(--nacre) inset; }
  .custom-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .custom-row input[type="color"] { width: 40px; height: 26px; padding: 0; border: 1px solid var(--tray-line); border-radius: 6px; background: transparent; cursor: pointer; }
  .sliders { display: grid; grid-template-columns: auto 1fr 3.4em; align-items: center; gap: 8px 8px; margin: 0; }
  .sliders output { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  .lights input[type="range"] { width: 100%; min-width: 0; margin: 0; accent-color: var(--nacre); }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .checks label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .lights input[type="checkbox"] { accent-color: var(--nacre); margin: 0; }
  .lights .plain { flex-direction: row; justify-content: center; padding: 6px 12px; }
  .lights button:focus-visible, .lights input:focus-visible { outline: 2px solid var(--nacre); outline-offset: 2px; }

  .hint {
    position: fixed; right: 16px; top: max(16px, env(safe-area-inset-top, 0px));
    margin: 0; padding: 0; list-style: none; text-align: right; pointer-events: none;
    font-size: 0.75rem; line-height: 1.7; color: var(--ink-dim); letter-spacing: 0.04em;
    text-shadow: 0 1px 10px rgba(10, 4, 24, 0.8);
  }
  .hint b { color: var(--ink); font-weight: 500; }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
    font: 500 0.95rem var(--font-body); letter-spacing: 0.2em; color: var(--ink-dim);
    transition: opacity 0.6s;
  }
  #loading.done { opacity: 0; }
  @media (max-width: 640px) {
    .hint { display: none; }
    .lights { left: 16px; right: 16px; width: auto; bottom: calc(124px + env(safe-area-inset-bottom, 0px)); max-height: calc(100% - 210px); }
    .title { right: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { #loading { transition: none; } }
</style>

<div id="stage"></div>
<header class="title">
  <h1>鸚鵡螺標本</h1>

<ul class="hint">
  <li><b>右鍵拖曳</b>　旋轉視角</li>

<div class="tray" role="group" aria-label="檢視控制">
  <button id="btn-reset" type="button">重設視角</button>
  <button id="btn-spin" type="button" aria-pressed="false">自動旋轉</button>
  <button id="btn-bg" type="button">背景：紫絨</button>
  <button id="btn-lights" type="button" aria-pressed="true" aria-controls="lights">光源設定</button>

  <h2>光源</h2>
  <div class="swatches" role="group" aria-label="光源顏色">
    <button type="button" data-preset="cool" aria-pressed="false"><i style="background:#86b4ff"></i>冷光<small>約 7500K</small></button>
    <button type="button" data-preset="natural" aria-pressed="true"><i style="background:#fff2e0"></i>自然光<small>約 5500K</small></button>
    <button type="button" data-preset="warm" aria-pressed="false"><i style="background:#ff9a48"></i>暖光<small>約 2700K</small></button>
  </div>
  <div class="custom-row"><label for="light-custom">自訂顏色</label><input id="light-custom" type="color" value="#fff2e0"></div>
  <div class="sliders">
    <label for="light-az">水平角</label><input id="light-az" type="range" min="-180" max="180" step="1" value="-32"><output id="out-az">-32°</output>
    <label for="light-el">高度角</label><input id="light-el" type="range" min="-80" max="88" step="1" value="40"><output id="out-el">40°</output>
    <label for="light-dist">距離</label><input id="light-dist" type="range" min="1.5" max="7" step="0.1" value="5.5"><output id="out-dist">5.5</output>
    <label for="light-gain">強度</label><input id="light-gain" type="range" min="0.1" max="3" step="0.05" value="1"><output id="out-gain">1.0×</output>
  </div>
  <div class="checks">
    <label for="light-show"><input id="light-show" type="checkbox" checked>顯示光源位置</label>
    <label for="light-orbit"><input id="light-orbit" type="checkbox">光源環繞</label>
  </div>
  <button id="light-reset" class="plain" type="button">重設光源</button>
</aside>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ *
 *  Shell parameters (planispiral, involute, ribbed, keeled)
 * ------------------------------------------------------------------ */
const TAU = Math.PI * 2;
const TURNS = 3.6;                    // whorls shown
const W_PER_TURN = 2.4;               // radius growth per whorl
const B = Math.log(W_PER_TURN) / TAU;
const TH_E = Math.PI;                 // aperture points to the left, as in the photo
const TH_S = TH_E - TURNS * TAU;
const RATIO = 0.68;                   // whorl height / outer radius
const WIDTH_K = 1.2;                 // half-width / half-height
const SUPER_N = 2.7;                  // flat flanks, rounded venter
const NRIB = 26;                      // primary ribs per whorl

const clamp01 = (x) => Math.min(1, Math.max(0, x));
const sstep = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;
const Ro = (th) => Math.exp(B * (th - TH_E));
const tOf = (phi) => (phi <= Math.PI ? phi : TAU - phi);   // 0 = venter, PI = umbilicus

function hash3(x, y, z) { const n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return n - Math.floor(n); }
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const l = (a, b, t) => a + (b - a) * t;
  return l(
    l(l(hash3(xi, yi, zi), hash3(xi + 1, yi, zi), u), l(hash3(xi, yi + 1, zi), hash3(xi + 1, yi + 1, zi), u), v),
    l(l(hash3(xi, yi, zi + 1), hash3(xi + 1, yi, zi + 1), u), l(hash3(xi, yi + 1, zi + 1), hash3(xi + 1, yi + 1, zi + 1), u), v),
    w);
}

// Cross-section of the tube at spiral angle th, point phi around it (scale shrinks it toward its centre).
const sec = { rho: 0, z: 0, nr: 1, nz: 0, R: 1 };
function section(th, phi, scale) {
  const R = Ro(th), h = RATIO * R * 0.5, c = R - h, wd = WIDTH_K * h;
  const cx = Math.cos(phi), sz = Math.sin(phi), e = 2 / SUPER_N;
  const xr = Math.sign(cx) * Math.pow(Math.abs(cx), e);
  const zr = Math.sign(sz) * Math.pow(Math.abs(sz), e);
  sec.rho = c + h * xr * scale;
  sec.z = wd * zr * scale;
  const gr = Math.sign(xr) * Math.pow(Math.abs(xr), SUPER_N - 1) / h;
  const gz = Math.sign(zr) * Math.pow(Math.abs(zr), SUPER_N - 1) / wd;
  const m = Math.hypot(gr, gz) || 1;
  sec.nr = gr / m; sec.nz = gz / m; sec.R = R;
  return sec;
}

// Rib pattern shared by geometry and textures so relief and colour line up.
const rb = { ph: 0, rib: 0, s: 0, P1: 0 };
function ribInfo(th, t) {
  const shift = 0.17 * Math.pow(1 - t / Math.PI, 1.3);          // ribs sweep forward toward the venter
  const ph = NRIB * (th - shift);
  const P1 = Math.pow(0.5 + 0.5 * Math.cos(ph), 2.2);
  const P2 = 0.7 * Math.pow(0.5 + 0.5 * Math.cos(2 * ph), 2.2) * sstep(1.9, 1.1, t); // intercalated ribs on the outer flank
  rb.ph = ph; rb.P1 = P1; rb.rib = Math.max(P1, P2);
  rb.s = (0.3 + 0.7 * sstep(0.15, 0.9, t)) * (1 - sstep(2.3, 2.95, t));
  return rb;
}

// Jagged broken edge of the last chamber
function breakAngle(phi) {
  const c = Math.cos(phi), s = Math.sin(phi);
  return TH_E - 0.03 - 0.20 * noise3(c * 1.5, s * 1.5, 3.1) - 0.07 * noise3(c * 5, s * 5, 7.7) - 0.03 * noise3(c * 14, s * 14, 1.3);
}

/* ------------------------------------------------------------------ *
 *  Geometry
 * ------------------------------------------------------------------ */
function buildShell() {
  const NT = 1800, NP = 144, cols = NP + 1;
  const count = (NT + 1) * cols;
  const pos = new Float32Array(count * 3), uv = new Float32Array(count * 2), col = new Float32Array(count * 3);
  const thEnd = new Float32Array(cols);
  for (let i = 0; i < cols; i++) thEnd[i] = breakAngle((i / NP) * TAU);

  let p = 0, q = 0;
  for (let j = 0; j <= NT; j++) {
    const thNom = TH_S + ((TH_E - TH_S) * j) / NT;
    for (let i = 0; i < cols; i++) {
      const phi = (i / NP) * TAU, t = tOf(phi);
      const th = Math.min(thNom, thEnd[i]);
      const g = 0.02 + 0.98 * sstep(TH_S, TH_S + 1.0, th);
      const s = section(th, phi, g);
      const r = ribInfo(thNom, t);
      const keel = Math.exp(-((t / 0.11) ** 2));
      const node = Math.exp(-(((t - 0.85) / 0.14) ** 2)) * Math.pow(r.P1, 3);
      const disp = s.R * g * (0.05 * r.rib * r.s + 0.026 * keel + 0.03 * node);
      const rho = s.rho + disp * s.nr, z = s.z + disp * s.nz;
      pos[p] = rho * Math.cos(th); pos[p + 1] = rho * Math.sin(th); pos[p + 2] = z;
      uv[q] = j / NT; uv[q + 1] = i / NP;
      // baked cavity shading: umbilical seam and small inner whorls sit in shadow
      let ao = mix(0.32, 1, sstep(3.14, 2.15, t)) * (0.12 + 0.88 * sstep(0.07, 0.42, s.R));
      ao *= 0.92 + 0.08 * r.rib;
      col[p] = col[p + 1] = col[p + 2] = ao;
      p += 3; q += 2;
    }
  }
  const idx = new Uint32Array(NT * NP * 6);
  let k = 0;
  for (let j = 0; j < NT; j++) for (let i = 0; i < NP; i++) {
    const a = j * cols + i, b = a + 1, c = a + cols, d = c + 1;
    idx[k++] = a; idx[k++] = c; idx[k++] = b;
    idx[k++] = b; idx[k++] = c; idx[k++] = d;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.computeVertexNormals();
  // close the normal seam where phi wraps around
  const n = geo.attributes.normal;
  for (let j = 0; j <= NT; j++) {
    const a = j * cols, b = a + NP;
    const x = n.getX(a) + n.getX(b), y = n.getY(a) + n.getY(b), z = n.getZ(a) + n.getZ(b);
    const m = Math.hypot(x, y, z) || 1;
    n.setXYZ(a, x / m, y / m, z / m); n.setXYZ(b, x / m, y / m, z / m);
  }
  return { geo, thEnd, NP };
}

// Broken end: thin pearly wall, then dark matrix-filled chamber
function buildCap(thEnd, NP) {
  const K = 12, cols = NP + 1, count = (K + 1) * cols;
  const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
  let p = 0;
  for (let k = 0; k <= K; k++) {
    const f = k / K;
    for (let i = 0; i < cols; i++) {
      const phi = (i / NP) * TAU, c = Math.cos(phi), s = Math.sin(phi);
      const nz = noise3(c * 3 + f * 5, s * 3, f * 4 + 2.2);
      const dep = 0.006 + 0.075 * Math.sqrt(f) + 0.035 * f * nz;
      const th = thEnd[i] - dep;
      const scale = k === 0 ? 0.985 : Math.max(0.012, 1 - 0.99 * f);
      const sc = section(th, phi, scale);
      pos[p] = sc.rho * Math.cos(th); pos[p + 1] = sc.rho * Math.sin(th); pos[p + 2] = sc.z;
      let r, g, b;
      if (k === 0) { r = 0.78; g = 0.72; b = 0.62; }
      else {
        const m = 0.10 + 0.10 * noise3(c * 6, s * 6, f * 9) + 0.05 * noise3(c * 22, s * 22, f * 30);
        const septa = Math.pow(Math.abs(Math.sin(f * 26 + nz * 2.5)), 6);
        r = m * 1.35 + 0.06 * septa; g = m * 1.05 + 0.04 * septa; b = m * 0.85 + 0.03 * septa;
        const dark = 1 - 0.55 * f;
        r *= dark; g *= dark; b *= dark;
      }
      col[p] = r; col[p + 1] = g; col[p + 2] = b;
      p += 3;
    }
  }
  const idx = [];
  for (let k = 0; k < K; k++) for (let i = 0; i < NP; i++) {
    const a = k * cols + i, b = a + 1, c = a + cols, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

/* ------------------------------------------------------------------ *
 *  Procedural nacre textures: colour, interference thickness, roughness, growth lines
 * ------------------------------------------------------------------ */
const PAL = [
  [0.00, 0.95, 0.52, 0.34], [0.14, 0.86, 0.26, 0.30], [0.28, 0.66, 0.42, 0.90],
  [0.44, 0.22, 0.72, 0.96], [0.58, 0.28, 0.90, 0.72], [0.72, 0.68, 0.95, 0.52],
  [0.86, 0.98, 0.84, 0.56], [1.00, 0.96, 0.52, 0.58],
];
function pal(x, out) {
  x = clamp01(x);
  for (let i = 1; i < PAL.length; i++) if (x <= PAL[i][0]) {
    const a = PAL[i - 1], b = PAL[i], t = (x - a[0]) / (b[0] - a[0]);
    out[0] = mix(a[1], b[1], t); out[1] = mix(a[2], b[2], t); out[2] = mix(a[3], b[3], t); return;
  }
}
function buildTextures(renderer) {
  const Wd = 3072, Ht = 384;
  const cCol = new Uint8Array(Wd * Ht * 4), cThk = new Uint8Array(Wd * Ht * 4),
        cRgh = new Uint8Array(Wd * Ht * 4), cBmp = new Uint8Array(Wd * Ht * 4);
  const rgb = [0, 0, 0];
  for (let py = 0; py < Ht; py++) {
    const phi = ((py + 0.5) / Ht) * TAU, t = tOf(phi), c = Math.cos(phi), s = Math.sin(phi);
    for (let px = 0; px < Wd; px++) {
      const th = TH_S + (TH_E - TH_S) * ((px + 0.5) / Wd);
      const r = ribInfo(th, t), rs = r.rib * r.s;
      const n1 = noise3(th * 0.9, c * 1.4, s * 1.4);
      const n2 = noise3(th * 4.0, c * 3 + 10, s * 3);
      const n3 = noise3(th * 14.0, c * 9 + 20, s * 9);
      const x = 0.86 - 0.27 * t + 0.38 * (n1 - 0.5) + 0.12 * (n2 - 0.5) + 0.05 * Math.sin(th * 0.7);
      pal(x, rgb);
      // pastel pearl under saturated interference colour; crests warmer and lighter, troughs deeper
      let R = mix(0.93, rgb[0], 0.62), G = mix(0.91, rgb[1], 0.62), Bc = mix(0.86, rgb[2], 0.62);
      R = mix(R, 1.0, 0.22 * rs); G = mix(G, 0.96, 0.22 * rs); Bc = mix(Bc, 0.86, 0.22 * rs);
      const sh = 0.88 + 0.12 * mix(r.rib, 1, 0.3);
      const o = (py * Wd + px) * 4;
      cCol[o] = Math.min(255, R * sh * 255); cCol[o + 1] = Math.min(255, G * sh * 255); cCol[o + 2] = Math.min(255, Bc * sh * 255); cCol[o + 3] = 255;
      const thick = 0.5 + 0.5 * Math.sin(2.4 * t + 6 * (n1 - 0.5) + 3 * (n2 - 0.5) + 1.6 * r.rib + th * 0.35);
      const tv = Math.min(255, thick * 255);
      cThk[o] = cThk[o + 1] = cThk[o + 2] = tv; cThk[o + 3] = 255;
      const rough = clamp01(0.28 + 0.5 * (1 - r.rib) + 0.25 * (n3 - 0.5)) * 255;
      cRgh[o] = cRgh[o + 1] = cRgh[o + 2] = rough; cRgh[o + 3] = 255;
      const gl = 0.5 + 0.5 * Math.sin(r.ph * 5 + 2.5 * n2);
      const bump = clamp01(0.5 * gl * (0.4 + 0.6 * r.s) + 0.3 * n3 + 0.2 * r.rib) * 255;
      cBmp[o] = cBmp[o + 1] = cBmp[o + 2] = bump; cBmp[o + 3] = 255;
    }
  }
  const aniso = renderer.capabilities.getMaxAnisotropy();
  const mk = (data, srgb) => {
    const tex = new THREE.DataTexture(data, Wd, Ht, THREE.RGBAFormat);
    tex.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    tex.wrapS = THREE.ClampToEdgeWrapping; tex.wrapT = THREE.RepeatWrapping;
    tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.generateMipmaps = true; tex.anisotropy = aniso; tex.needsUpdate = true;
    return tex;
  };
  return { color: mk(cCol, true), thick: mk(cThk, false), rough: mk(cRgh, false), bump: mk(cBmp, false) };
}

/* ------------------------------------------------------------------ *
 *  Scene
 * ------------------------------------------------------------------ */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);

const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 60);
const HOME = { pos: new THREE.Vector3(0.55, -0.75, 3.9), target: new THREE.Vector3(-0.1, 0, 0) };
camera.position.copy(HOME.pos);

/* ------------------------------------------------------------------ *
 *  Lighting: one movable key light (colour + position), tinted fill/rim and tinted reflections
 * ------------------------------------------------------------------ */
const PRESETS = { cool: 0x86b4ff, natural: 0xfff2e0, warm: 0xff9a48 };
const LIGHT_HOME = { az: -32, el: 40, dist: 5.5, gain: 1 };
const L = { ...LIGHT_HOME, color: new THREE.Color(PRESETS.natural), orbit: false };
const WHITE = new THREE.Color(1, 1, 1);

const key = new THREE.SpotLight(0xffffff, 2.4, 0, 0.6, 0.7, 0);   // decay 0: distance changes the angle of incidence, not brightness
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.012;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.6); rim.position.set(3, -2, -2); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(3, 1, 3); scene.add(fill);

// visible light marker: bright bead with a soft halo
const haloCanvas = document.createElement('canvas'); haloCanvas.width = haloCanvas.height = 128;
{ const g = haloCanvas.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); }
const bead = new THREE.Mesh(new THREE.SphereGeometry(0.07, 20, 12), new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }));
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(haloCanvas), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, toneMapped: false }));
halo.scale.setScalar(0.9);
const marker = new THREE.Group(); marker.add(bead, halo); scene.add(marker);

let envTex = null, envTimer = 0;
function rebuildEnvironment() {
  const room = new RoomEnvironment();
  const tint = WHITE.clone().lerp(L.color, 0.85);
  room.traverse((o) => {
    if (o.isLight) o.color.multiply(tint);
    else if (o.isMesh && o.material && o.material.color) { o.material = o.material.clone(); o.material.color.multiply(tint); }
  });
  const tex = pmrem.fromScene(room, 0.03).texture;
  if (envTex) envTex.dispose();
  envTex = tex; scene.environment = tex;
  room.dispose && room.dispose();
}
function applyLight({ env = false } = {}) {
  const a = THREE.MathUtils.degToRad(L.az), e = THREE.MathUtils.degToRad(L.el);
  key.position.set(L.dist * Math.cos(e) * Math.sin(a), L.dist * Math.sin(e), L.dist * Math.cos(e) * Math.cos(a));
  key.angle = Math.min(1.25, Math.atan(1.8 / L.dist));
  key.intensity = 2.4 * L.gain;
  key.shadow.camera.near = Math.max(0.1, L.dist - 2.4); key.shadow.camera.far = L.dist + 3;
  key.color.copy(L.color);
  fill.color.copy(L.color).lerp(WHITE, 0.45);
  rim.color.copy(L.color).lerp(WHITE, 0.45);
  marker.position.copy(key.position);
  bead.material.color.copy(L.color).lerp(WHITE, 0.35);
  halo.material.color.copy(L.color);
  const dist = key.position.length(); halo.scale.setScalar(0.12 * dist + 0.25);
  if (env) { clearTimeout(envTimer); envTimer = setTimeout(rebuildEnvironment, 40); }
}
rebuildEnvironment();
applyLight();

const controls = new OrbitControls(camera, renderer.domElement);
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.zoomToCursor = true;
controls.rotateSpeed = 0.9; controls.zoomSpeed = 1.1;
controls.minDistance = 0.12; controls.maxDistance = 14;
controls.autoRotateSpeed = 1.6;
controls.target.copy(HOME.target);
controls.update();

function resize() {
  const w = stage.clientWidth || window.innerWidth, h = stage.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 62 : 32;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

const mats = [];
function build() {
  const tex = buildTextures(renderer);
  const shellMat = new THREE.MeshPhysicalMaterial({
    map: tex.color, vertexColors: true,
    roughness: 0.6, roughnessMap: tex.rough, metalness: 0.28,
    bumpMap: tex.bump, bumpScale: 1.6,
    clearcoat: 1, clearcoatRoughness: 0.05,
    iridescence: 1, iridescenceIOR: 1.9, iridescenceThicknessRange: [200, 800], iridescenceThicknessMap: tex.thick,
    sheen: 0.4, sheenRoughness: 0.4, sheenColor: new THREE.Color(0xd9c8ff),
    envMapIntensity: 1.4,
  });
  const capMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0.0, side: THREE.DoubleSide, envMapIntensity: 0.5 });
  mats.push(shellMat);

  const { geo, thEnd, NP } = buildShell();
  const shell = new THREE.Mesh(geo, shellMat);
  const cap = new THREE.Mesh(buildCap(thEnd, NP), capMat);
  for (const m of [shell, cap]) { m.castShadow = true; m.receiveShadow = true; }
  const group = new THREE.Group();
  // embryonic chamber plugging the centre of the spiral
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.05, 24, 16), new THREE.MeshStandardMaterial({ color: 0x1b1210, roughness: 0.9 }));
  group.add(shell, cap, core);
  scene.add(group);
}

/* ------------------------------------------------------------------ *
 *  UI
 * ------------------------------------------------------------------ */
document.getElementById('btn-reset').addEventListener('click', () => {
  camera.position.copy(HOME.pos); controls.target.copy(HOME.target); controls.update();
});
const spin = document.getElementById('btn-spin');
spin.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  spin.setAttribute('aria-pressed', String(controls.autoRotate));
});
const BGS = [['velvet', '紫絨'], ['black', '黑'], ['grey', '灰']];
let bgIdx = 0;
const bgBtn = document.getElementById('btn-bg');
bgBtn.addEventListener('click', () => {
  bgIdx = (bgIdx + 1) % BGS.length;
  stage.dataset.bg = BGS[bgIdx][0];
  bgBtn.textContent = '背景：' + BGS[bgIdx][1];
});
document.getElementById('gloss').addEventListener('input', (e) => {
  const v = parseFloat(e.target.value);
  for (const m of mats) m.envMapIntensity = v;
});


// ---- light panel ----
const $ = (id) => document.getElementById(id);
const panel = $('lights'), lightsBtn = $('btn-lights');
function setPanel(open) { panel.hidden = !open; lightsBtn.setAttribute('aria-pressed', String(open)); }
setPanel(window.innerWidth > 640);
lightsBtn.addEventListener('click', () => setPanel(panel.hidden));

const swatches = [...panel.querySelectorAll('[data-preset]')];
function pickPreset(name) {
  L.color.set(PRESETS[name]);
  swatches.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.preset === name)));
  $('light-custom').value = '#' + L.color.getHexString();
  applyLight({ env: true });
}
swatches.forEach((b) => b.addEventListener('click', () => pickPreset(b.dataset.preset)));
$('light-custom').addEventListener('input', (e) => {
  L.color.set(e.target.value);
  swatches.forEach((b) => b.setAttribute('aria-pressed', 'false'));
  applyLight({ env: true });
});

const sliders = [
  ['az', 'light-az', 'out-az', (v) => v.toFixed(0) + '°'],
  ['el', 'light-el', 'out-el', (v) => v.toFixed(0) + '°'],
  ['dist', 'light-dist', 'out-dist', (v) => v.toFixed(1)],
  ['gain', 'light-gain', 'out-gain', (v) => v.toFixed(2) + '×'],
];
function syncSliders() {
  for (const [k, id, out, fmt] of sliders) { $(id).value = L[k]; $(out).textContent = fmt(L[k]); }
}
for (const [k, id, out, fmt] of sliders) {
  $(id).addEventListener('input', (e) => { L[k] = parseFloat(e.target.value); $(out).textContent = fmt(L[k]); applyLight(); });
}
$('light-show').addEventListener('change', (e) => { marker.visible = e.target.checked; });
$('light-orbit').addEventListener('change', (e) => { L.orbit = e.target.checked; });
$('light-reset').addEventListener('click', () => {
  Object.assign(L, LIGHT_HOME); $('light-orbit').checked = false; L.orbit = false;
  syncSliders(); pickPreset('natural');
});
syncSliders();

let lastT = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.1, ((now || performance.now()) - lastT) / 1000); lastT = now || performance.now();
  if (L.orbit) {
    L.az = ((L.az + 24 * dt + 180) % 360) - 180;
    $('light-az').value = L.az; $('out-az').textContent = L.az.toFixed(0) + '°';
    applyLight();
  }
  controls.update(); renderer.render(scene, camera);
});

// let the loading label paint before the heavy texture pass
setTimeout(() => {
  build();
  document.getElementById('loading').classList.add('done');
  window.__ready = true;
}, 60);
window.__three = { THREE, camera, controls, renderer, scene, HOME, L, applyLight };
</script>
