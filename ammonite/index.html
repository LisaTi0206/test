<style>
  /* Layout: full-bleed specimen stage; title top-left, control tray bottom-left, hint bottom-right. */
  :root {
    --velvet-hi: #5b2f86;
    --velvet-lo: #180c2b;
    --ink: #f3ecff;
    --ink-dim: #b9a9d6;
    --nacre: #9fe8d4;
    --tray: rgba(24, 12, 43, 0.62);
    --tray-line: rgba(200, 175, 240, 0.28);
    --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--velvet-lo); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
  #stage {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 42%, var(--velvet-hi) 0%, #3a1c5c 38%, var(--velvet-lo) 100%);
    touch-action: none;
  }
  #stage[data-bg="black"] { background: radial-gradient(ellipse at 50% 42%, #2a2630 0%, #0a090c 100%); }
  #stage[data-bg="grey"]  { background: radial-gradient(ellipse at 50% 42%, #dcd8e2 0%, #8d8896 100%); }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(6,2,14,0.42) 100%); }
  canvas { display: block; width: 100%; height: 100%; outline: none; cursor: grab; }
  canvas:active { cursor: grabbing; }

  .title {
    position: fixed; top: max(16px, env(safe-area-inset-top, 0px)); left: 16px; right: 16px;
    pointer-events: none; display: flex; flex-direction: column; gap: 2px;
    text-shadow: 0 1px 12px rgba(10, 4, 24, 0.7);
  }
  .title h1 { margin: 0; font: 600 1.35rem/1.25 var(--font-display); letter-spacing: 0.06em; }
  .title p { margin: 0; font-size: 0.8rem; color: var(--ink-dim); letter-spacing: 0.04em; }

  .tray {
    position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 10px 12px; width: fit-content; max-width: calc(100% - 32px); box-sizing: border-box;
    background: var(--tray); border: 1px solid var(--tray-line); border-radius: 10px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .tray button {
    font: 500 0.8rem var(--font-body); color: var(--ink); background: transparent;
    border: 1px solid var(--tray-line); border-radius: 6px; padding: 6px 12px; cursor: pointer;
    letter-spacing: 0.04em;
  }
  .tray button:hover { border-color: var(--nacre); }
  .tray button[aria-pressed="true"] { background: var(--nacre); color: #14312b; border-color: var(--nacre); }
  .tray button:focus-visible, .tray input:focus-visible { outline: 2px solid var(--nacre); outline-offset: 2px; }
  .tray label { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--ink-dim); }
  .tray input[type="range"] { width: 96px; accent-color: var(--nacre); }


  .lights {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: 264px; box-sizing: border-box; max-height: calc(100% - 120px); overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px; padding: 12px 14px 14px;
    background: var(--tray); border: 1px solid var(--tray-line); border-radius: 10px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 0.8rem; color: var(--ink-dim);
  }
  [hidden] { display: none !important; }
  .lights h2 { margin: 0; font: 500 0.75rem var(--font-body); letter-spacing: 0.14em; color: var(--ink); }
  .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .swatches button, .lights .plain {
    font: 500 0.8rem var(--font-body); color: var(--ink); background: transparent; letter-spacing: 0.04em;
    border: 1px solid var(--tray-line); border-radius: 6px; padding: 6px 4px; cursor: pointer;

  .sliders output { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }

  @media (max-width: 640px) {

  @media (prefers-reduced-motion: reduce) { #loading { transition: none; } }

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
} }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { HorizontalBlurShader } from 'three/addons/shaders/HorizontalBlurShader.js';
import { VerticalBlurShader } from 'three/addons/shaders/VerticalBlurShader.js';
import * as CANNON from 'cannon-es';

/* ------------------------------------------------------------------ *
 *  Shell parameters (planispiral, involute, ribbed, keeled)
 * ------------------------------------------------------------------ */
const TAU = Math.PI * 2;
const TURNS = 3.6;                    // whorls shown
const W_PER_TURN = 2.4;               // radius growth per whorl
const B = Math.log(W_PER_TURN) / TAU;
const TH_E = Math.PI;                 // aperture points to the left, as in the photo
const TH_S = TH_E - TURNS * TAU;
const RATIO = 0.68;                   // whorl height / outer radius
const WIDTH_K = 1.2;                 // half-width / half-height
const SUPER_N = 2.7;                  // flat flanks, rounded venter
const NRIB = 26;                      // primary ribs per whorl

const clamp01 = (x) => Math.min(1, Math.max(0, x));
const sstep = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;
const Ro = (th) => Math.exp(B * (th - TH_E));
const tOf = (phi) => (phi <= Math.PI ? phi : TAU - phi);   // 0 = venter, PI = umbilicus

function hash3(x, y, z) { const n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return n - Math.floor(n); }
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const l = (a, b, t) => a + (b - a) * t;
  return l(
    l(l(hash3(xi, yi, zi), hash3(xi + 1, yi, zi), u), l(hash3(xi, yi + 1, zi), hash3(xi + 1, yi + 1, zi), u), v),
    l(l(hash3(xi, yi, zi + 1), hash3(xi + 1, yi, zi + 1), u), l(hash3(xi, yi + 1, zi + 1), hash3(xi + 1, yi + 1, zi + 1), u), v),
    w);
}

// Cross-section of the tube at spiral angle th, point phi around it (scale shrinks it toward its centre).
const sec = { rho: 0, z: 0, nr: 1, nz: 0, R: 1 };
function section(th, phi, scale) {
  const R = Ro(th), h = RATIO * R * 0.5, c = R - h, wd = WIDTH_K * h;
  const cx = Math.cos(phi), sz = Math.sin(phi), e = 2 / SUPER_N;
  const xr = Math.sign(cx) * Math.pow(Math.abs(cx), e);
  const zr = Math.sign(sz) * Math.pow(Math.abs(sz), e);
  sec.rho = c + h * xr * scale;
  sec.z = wd * zr * scale;
  const gr = Math.sign(xr) * Math.pow(Math.abs(xr), SUPER_N - 1) / h;
  const gz = Math.sign(zr) * Math.pow(Math.abs(zr), SUPER_N - 1) / wd;
  const m = Math.hypot(gr, gz) || 1;
  sec.nr = gr / m; sec.nz = gz / m; sec.R = R;
  return sec;
}

// Rib pattern shared by geometry and textures so relief and colour line up.
const rb = { ph: 0, rib: 0, s: 0, P1: 0 };
function ribInfo(th, t) {
  const shift = 0.17 * Math.pow(1 - t / Math.PI, 1.3);          // ribs sweep forward toward the venter
  let ph = NRIB * (th - shift) + 1.3 * (noise3(th * 2.3, 4.4, 1.1) - 0.5);   // uneven rib spacing
  const P1 = Math.pow(0.5 + 0.5 * Math.cos(ph), 2.2);
  const P2 = 0.7 * Math.pow(0.5 + 0.5 * Math.cos(2 * ph), 2.2) * sstep(1.9, 1.1, t); // intercalated ribs on the outer flank
  const amp = 0.7 + 0.5 * hash3(Math.floor(ph / TAU + 0.5) * 1.7, 3.1, 5.3);            // some ribs stronger than others
  rb.ph = ph; rb.P1 = P1; rb.rib = Math.max(P1, P2) * amp;
  rb.s = (0.3 + 0.7 * sstep(0.15, 0.9, t)) * (1 - sstep(2.3, 2.95, t));
  return rb;
}

// Fossil damage: chipped keel/rib tips (kind 0, cut through) and flaked-off shell on the flanks (kind 1, matrix showing).
// A few large chips are placed by hand (these are the largest allowed); the rest follow a power law so most are tiny and only show up close.
// [angle back from the aperture, signed position around the tube (+ = face up), radius along/around, depth, kind]
const BIG_CHIPS = [
  [-0.30, 0.55, 0.07, 0.11, 0.075, 0], [-1.55, 0.30, 0.05, 0.08, 0.070, 0], [-0.90, -0.35, 0.06, 0.09, 0.070, 0],
  [-1.25, 1.35, 0.10, 0.08, 0.012, 1], [-3.30, 1.55, 0.08, 0.07, 0.010, 1], [-0.18, -1.10, 0.06, 0.10, 0.016, 1],
];
function seeded(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const CHIP_LIST = (() => {
  const rnd = seeded(20240930), list = BIG_CHIPS.map((c) => c.slice());
  for (let n = 0; n < 70; n++) {
    const flake = rnd() < 0.5;
    const ax = Math.max(0.010, 0.085 * Math.pow(rnd(), 2.6));                       // mostly small, few medium
    const ay = ax * (0.8 + 0.7 * rnd());
    const ts = flake ? (rnd() * 2 - 1) * 1.9 : (rnd() < 0.5 ? 1 : -1) * (0.05 + rnd() * 0.85);
    const depth = flake ? 0.006 + 0.008 * rnd() : 0.04 + 0.03 * rnd();
    list.push([-rnd() * 7.0, ts, ax, ay, depth, flake ? 1 : 0]);
  }
  return list;
})().map((c, i) => {
  const th = TH_E + c[0], R = Ro(th), sz = Math.pow(R, 0.7);
  return { th, ts: c[1], ka: R * (1 - RATIO / 2), kp: R * RATIO * 0.25 * (1 + WIDTH_K), ax: c[2] * sz, ay: c[3] * sz, depth: c[4], kind: c[5], seed: i * 13.7 };
});
const chip = { mask: 0, floor: 0 };
function chipField(th, ts) {
  chip.mask = 0; chip.floor = 0;
  for (const c of CHIP_LIST) {
    const dth = th - c.th;
    if (dth > 0.6 || dth < -0.6) continue;
    const ds = dth * c.ka, dp = (ts - c.ts) * c.kp;
    let d = Math.hypot(ds / c.ax, dp / c.ay);
    d *= 1 + 0.5 * (noise3(ds * 30 + c.seed, dp * 30, c.seed) - 0.5) + 0.3 * (noise3(ds * 90, dp * 90, c.seed + 3) - 0.5);
    const m = 1 - sstep(0.78, 1.0, d);
    if (m <= 0) continue;
    if (m > chip.mask) chip.mask = m;
    const fl = -(c.kind === 0 ? 0.007 * (0.6 + 0.4 * (1 - d)) : 0.005) * m;   // ribs/keel shaved off, deepest in the middle (stays above the inner wall)
    if (fl < chip.floor) chip.floor = fl;
  }
  return chip;
}

// Jagged broken edge of the last chamber
function breakAngle(phi) {
  const c = Math.cos(phi), s = Math.sin(phi);
  return TH_E - 0.03 - 0.20 * noise3(c * 1.5, s * 1.5, 3.1) - 0.07 * noise3(c * 5, s * 5, 7.7) - 0.03 * noise3(c * 14, s * 14, 1.3);
}

/* ------------------------------------------------------------------ *
 *  Geometry
 * ------------------------------------------------------------------ */
function buildShell() {
  const NT = 1800, NP = 144, cols = NP + 1;
  const count = (NT + 1) * cols;
  const pos = new Float32Array(count * 3), uv = new Float32Array(count * 2), col = new Float32Array(count * 3), surf = new Float32Array(count * 2), dmg = new Float32Array(count);
  const thEnd = new Float32Array(cols);
  for (let i = 0; i < cols; i++) thEnd[i] = breakAngle((i / NP) * TAU);

  let p = 0, q = 0;
  for (let j = 0; j <= NT; j++) {
    const thNom = TH_S + ((TH_E - TH_S) * j) / NT;
    for (let i = 0; i < cols; i++) {
      const phi = (i / NP) * TAU, t = tOf(phi);
      const th = Math.min(thNom, thEnd[i]);
      const g = 0.02 + 0.98 * sstep(TH_S, TH_S + 1.0, th);
      const s = section(th, phi, g);
      const r = ribInfo(thNom, t);
      const keel = Math.exp(-((t / 0.11) ** 2));
      const node = Math.exp(-(((t - 0.85) / 0.14) ** 2)) * Math.pow(r.P1, 3);
      const cph = Math.cos(phi), sph = Math.sin(phi);
      let disp = s.R * g * (0.05 * r.rib * r.s + 0.026 * keel + 0.03 * node);
      disp += s.R * g * 0.022 * (noise3(thNom * 1.7, cph * 1.3 + 5, sph * 1.3) - 0.5);      // slow undulation of a slightly crushed shell
      const ch = chipField(thNom, phi <= Math.PI ? phi : phi - TAU);
      if (ch.mask > 0) disp = mix(disp, Math.min(disp, s.R * ch.floor), ch.mask);
      const wob = 1 + 0.03 * (noise3(thNom * 0.55, 1.3, 4.7) - 0.5);                          // uneven growth
      const rho = (s.rho + disp * s.nr) * wob, z = (s.z + disp * s.nz) * (2 - wob);
      pos[p] = rho * Math.cos(th); pos[p + 1] = rho * Math.sin(th); pos[p + 2] = z;
      dmg[i + j * cols] = ch.mask;
      uv[q] = j / NT; uv[q + 1] = i / NP;
      // physical surface coordinates (arc length along the spiral, distance around the tube) for the shell micro-texture
      surf[q] = s.R * (1 - RATIO / 2) / B;
      surf[q + 1] = t * s.R * RATIO * 0.25 * (1 + WIDTH_K);
      // baked cavity shading: umbilical seam and small inner whorls sit in shadow
      let ao = mix(0.42, 1, sstep(3.14, 2.15, t)) * (0.4 + 0.6 * sstep(0.03, 0.26, s.R));
      ao *= 0.92 + 0.08 * r.rib;
      col[p] = col[p + 1] = col[p + 2] = ao;
      p += 3; q += 2;
    }
  }
  const idx = new Uint32Array(NT * NP * 6);
  let k = 0;
  for (let j = 0; j < NT; j++) for (let i = 0; i < NP; i++) {
    const a = j * cols + i, b = a + 1, c = a + cols, d = c + 1;
    idx[k++] = a; idx[k++] = c; idx[k++] = b;
    idx[k++] = b; idx[k++] = c; idx[k++] = d;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aSurf', new THREE.BufferAttribute(surf, 2));
  geo.setAttribute('aDamage', new THREE.BufferAttribute(dmg, 1));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.computeVertexNormals();
  // close the normal seam where phi wraps around
  const n = geo.attributes.normal;
  for (let j = 0; j <= NT; j++) {
    const a = j * cols, b = a + NP;
    const x = n.getX(a) + n.getX(b), y = n.getY(a) + n.getY(b), z = n.getZ(a) + n.getZ(b);
    const m = Math.hypot(x, y, z) || 1;
    n.setXYZ(a, x / m, y / m, z / m); n.setXYZ(b, x / m, y / m, z / m);
  }
  return { geo, thEnd, NP };
}

// Broken end, as on real iridescent ammonites: a thin nacre wall, and inside it the chamber is filled with rock matrix
// whose rough fracture surface sits a little below the shell edge.
function buildCap(thEnd, NP) {
  const K = 26, cols = NP + 1, rings = K + 2, thMean = TH_E - 0.14;
  const pos = new Float32Array(rings * cols * 3), col = new Float32Array(rings * cols * 3);
  let p = 0;

}

const PAL = [   // restrained: warm flash at the shoulder, teal/green on the flanks, cream toward the venter
  [0.00, 0.93, 0.58, 0.42], [0.14, 0.90, 0.60, 0.66], [0.28, 0.74, 0.68, 0.86],
  [0.44, 0.46, 0.76, 0.86], [0.58, 0.46, 0.86, 0.72], [0.72, 0.68, 0.88, 0.62],

// tileable woven-pile cloth
function buildClothTexture(renderer) {
  const N = 512, P = 64, data = new Uint8Array(N * N * 4);

  const md = (a, m) => ((a % m) + m) % m;
  const pn = (x, y, m) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hh(md(xi, m), md(yi, m)), b = hh(md(xi + 1, m), md(yi, m)), c = hh(md(xi, m), md(yi + 1, m)), d = hh(md(xi + 1, m), md(yi + 1, m));
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const weave = 0.5 + 0.5 * Math.sin(x * Math.PI / 2) * Math.sin(y * Math.PI / 2);
    let v = 0.62 + 0.22 * (pn(x / 8, y / 8, P) - 0.5) + 0.18 * (pn(x / 2, y / 2, N / 2) - 0.5) + 0.22 * (hh(x, y) - 0.5) + 0.06 * weave;
    v = Math.min(1, Math.max(0, v)) * 255;
    const o = (y * N + x) * 4; data[o] = data[o + 1] = data[o + 2] = v; data[o + 3] = 255;
  }

  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(180, 180);
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); t.needsUpdate = true;

/* ------------------------------------------------------------------ *
 *  Shell micro-texture (shader): ammolite "dragon-skin" scales, hairline cracks, fine grain.
 *  Works in physical surface units so the detail stays sharp when zooming in.
 * ------------------------------------------------------------------ */
const CELL = 0.022;
function patchShellShader(mat) {
  mat.onBeforeCompile = (sh) => {

      .replace('#include <common>', '#include <common>\nattribute vec2 aSurf;\nvarying vec2 vSurf;\nattribute float aDamage;\nvarying float vDmg;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvSurf = aSurf; vDmg = aDamage;');

varying vec2 vSurf;
varying float vDmg;
vec2 h22(vec2 p){ p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }
float h21(vec2 p){ return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5453); }

  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y);
}
vec3 voro(vec2 x){

  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 g = vec2(float(i), float(j)); vec2 r = g + h22(n + g) - f; float d = dot(r, r);
    if (d < d1) { d2 = d1; d1 = d; id = n + g; } else if (d < d2) { d2 = d; }

  applyBackdrop();
  marker.position.copy(key.position);
  bead.material.color.copy(L.color).lerp(WHITE, 0.35);
  halo.material.color.copy(L.color);
  const dist = key.position.length(); halo.scale.setScalar(0.12 * dist + 0.25);
  if (env) { clearTimeout(envTimer); envTimer = setTimeout(rebuildEnvironment, 40); }
}
rebuildEnvironment();
applyLight();

const controls = new OrbitControls(camera, renderer.domElement);
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.zoomToCursor = true;
controls.rotateSpeed = 0.9; controls.zoomSpeed = 1.1;
controls.minDistance = 0.12; controls.maxDistance = 14;
controls.autoRotateSpeed = 1.6;
controls.target.copy(HOME.target);
controls.update();

function resize() {
  const w = stage.clientWidth || window.innerWidth, h = stage.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 62 : 32;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

const mats = [];
function build() {
  const tex = buildTextures(renderer);
  const shellMat = new THREE.MeshPhysicalMaterial({
    map: tex.color, vertexColors: true,
    roughness: 0.95, roughnessMap: tex.rough, metalness: 0.3,
    bumpMap: tex.bump, bumpScale: 2.2,
    clearcoat: 0.04, clearcoatRoughness: 0.6,
    iridescence: 1, iridescenceIOR: 1.85, iridescenceThicknessRange: [250, 700], iridescenceThicknessMap: tex.thick,
    sheen: 0.25, sheenRoughness: 0.6, sheenColor: new THREE.Color(0xe6e0f0),
    envMapIntensity: 1.1, fog: false,
  });
  patchShellShader(shellMat);
  const capMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0.0, side: THREE.DoubleSide, envMapIntensity: 0.35, fog: false });
  patchMatrixShader(capMat);
  mats.push(shellMat);

  const { geo, thEnd, NP } = buildShell();
  const shell = new THREE.Mesh(geo, shellMat);
  const cap = new THREE.Mesh(buildCap(thEnd, NP), capMat);
  for (const m of [shell, cap]) { m.castShadow = true; m.receiveShadow = true; }
  const group = new THREE.Group();
  // embryonic chamber plugging the centre of the spiral
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.05, 24, 16), new THREE.MeshStandardMaterial({ color: 0x1b1210, roughness: 0.9 }));
  group.add(shell, cap, core);
  shellMesh = shell;

  const cloth = buildClothTexture(renderer);
  floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), new THREE.MeshPhysicalMaterial({
    color: backdrop.cloth, map: cloth, bumpMap: cloth, bumpScale: 3.0, roughness: 1.0, metalness: 0,
    sheen: 1, sheenRoughness: 0.55, sheenColor: new THREE.Color(0xb98cf0), envMapIntensity: 0.35,
  }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = FLOOR_Y; floor.receiveShadow = true;
  scene.add(floor);
  applyBackdrop();
  setupContactShadow();
  setupPhysics(group);
}

/* ------------------------------------------------------------------ *
 *  Physics (cannon-es): the spiral is a chain of box colliders; it drops onto the cloth,
 *  bounces, slides on friction and settles. Contact shadow is rendered from below.
 * ------------------------------------------------------------------ */
let world = null, body = null, pivot = null, shellMesh = null, recentred = true, topples = 0;
const recentre = new THREE.Vector3();
const DROP_HEIGHT = 1.5;
function setupPhysics(model) {
  world = new CANNON.World({ gravity: new CANNON.Vec3(0, -32, 0) });
  world.allowSleep = true;
  world.defaultContactMaterial.contactEquationStiffness = 2e7;
  const clothM = new CANNON.Material('cloth'), shellM = new CANNON.Material('shell');
  world.addContactMaterial(new CANNON.ContactMaterial(clothM, shellM, { friction: 0.85, restitution: 0.1 }));
  const ground = new CANNON.Body({ mass: 0, material: clothM, shape: new CANNON.Plane() });
  ground.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
  ground.position.set(0, FLOOR_Y, 0);
  world.addBody(ground);

  // one box per slice of the whorl: radial half = whorl height, axial half = whorl half-width (+ rib relief)
  const DTH = 0.2, parts = [];
  const com = new CANNON.Vec3(); let vol = 0;
  for (let th = TH_E - 0.2; Ro(th) > 0.09; th -= DTH) {
    const R = Ro(th), h = RATIO * R * 0.5, c = R - h;
    const hx = h + 0.012 * R, hy = c * DTH * 0.51, hz = WIDTH_K * h + 0.035 * R;
    const ctr = new CANNON.Vec3(c * Math.cos(th), c * Math.sin(th), 0);
    const v = hx * hy * hz;
    com.x += ctr.x * v; com.y += ctr.y * v; vol += v;
    parts.push({ hx, hy, hz, ctr, th });
  }
  com.scale(1 / vol, com);
  body = new CANNON.Body({ mass: 1, material: shellM, linearDamping: 0.04, angularDamping: 0.25, allowSleep: true, sleepSpeedLimit: 0.5, sleepTimeLimit: 0.4 });
  for (const q of parts) {
    const rot = new CANNON.Quaternion(); rot.setFromEuler(0, 0, q.th);
    body.addShape(new CANNON.Box(new CANNON.Vec3(q.hx, q.hy, q.hz)), q.ctr.vsub(com), rot);
  }
  world.addBody(body);

  pivot = new THREE.Group();
  model.position.set(-com.x, -com.y, 0);
  pivot.add(model);
  scene.add(pivot);
  dropSpecimen();
}
const rnd = (a, b) => a + Math.random() * (b - a);
function dropSpecimen() {
  const base = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0));       // face up
  const yaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd(-0.7, 0.7));
  const axis = new THREE.Vector3(Math.cos(rnd(0, TAU)), 0, Math.sin(rnd(0, TAU))).normalize();
  const tilt = new THREE.Quaternion().setFromAxisAngle(axis, rnd(0.2, 0.7));
  const q = tilt.multiply(yaw).multiply(base);
  body.quaternion.set(q.x, q.y, q.z, q.w);
  body.position.set(rnd(0.1, 0.35), FLOOR_Y + DROP_HEIGHT, rnd(-0.1, 0.1));
  body.velocity.set(rnd(-0.4, 0.4), 0, rnd(-0.4, 0.4));
  body.angularVelocity.set(rnd(-2.5, 2.5), rnd(-1.5, 1.5), rnd(-2.5, 2.5));
  body.wakeUp(); recentred = false; topples = 0;
}
// if it comes to rest balanced on its rim, give it the gentle knock that would topple it onto its face
function toppleIfStanding() {
  const q = new THREE.Quaternion(body.quaternion.x, body.quaternion.y, body.quaternion.z, body.quaternion.w);
  const axis = new THREE.Vector3(0, 0, 1).applyQuaternion(q);
  if (Math.abs(axis.y) > 0.6 || topples >= 4) return false;
  topples++;
  body.wakeUp();
  body.applyImpulse(new CANNON.Vec3(axis.x * 0.8, 0, axis.z * 0.8), new CANNON.Vec3(0, 0.6, 0));
  return true;
}
function pokeSpecimen(point) {
  const dir = point.clone().sub(camera.position); dir.y = 0; dir.normalize();
  const imp = new CANNON.Vec3(dir.x * 1.6, 0.9, dir.z * 1.6);
  body.wakeUp(); recentred = false;
  body.applyImpulse(imp, new CANNON.Vec3(point.x - body.position.x, point.y - body.position.y, point.z - body.position.z));
}
function stepPhysics(dt) {
  if (!world) return;
  world.step(1 / 120, dt, 6);
  pivot.position.set(body.position.x, body.position.y, body.position.z);
  pivot.quaternion.set(body.quaternion.x, body.quaternion.y, body.quaternion.z, body.quaternion.w);
  if (body.position.y < FLOOR_Y - 3 || Math.abs(body.position.x) > 12 || Math.abs(body.position.z) > 12) dropSpecimen();
}

// contact shadow: depth of the specimen seen from beneath the cloth, blurred, drawn just above the cloth
const CS = { size: 4.2, height: 0.7 };
let csTarget, csBlur, csPlane, csBlurPlane, csCamera, csGroup, csDepth, csHBlur, csVBlur;
function setupContactShadow() {
  csGroup = new THREE.Group(); scene.add(csGroup);
  csTarget = new THREE.WebGLRenderTarget(512, 512); csTarget.texture.generateMipmaps = false;
  csBlur = new THREE.WebGLRenderTarget(512, 512); csBlur.texture.generateMipmaps = false;
  const geo = new THREE.PlaneGeometry(CS.size, CS.size).rotateX(Math.PI / 2);
  csPlane = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: csTarget.texture, opacity: 0.85, transparent: true, depthWrite: false, fog: false }));
  csPlane.renderOrder = 1; csPlane.scale.y = -1; csGroup.add(csPlane);
  csBlurPlane = new THREE.Mesh(geo); csBlurPlane.visible = false; csGroup.add(csBlurPlane);
  csCamera = new THREE.OrthographicCamera(-CS.size / 2, CS.size / 2, CS.size / 2, -CS.size / 2, 0, CS.height);
  csCamera.rotation.x = Math.PI / 2; csGroup.add(csCamera);
  csDepth = new THREE.MeshDepthMaterial(); csDepth.userData.darkness = { value: 1.9 };
  csDepth.onBeforeCompile = (sh) => {
    sh.uniforms.darkness = csDepth.userData.darkness;
    sh.fragmentShader = 'uniform float darkness;\n' + sh.fragmentShader.replace('gl_FragColor = vec4( vec3( 1.0 - fragCoordZ ), opacity );', 'gl_FragColor = vec4( vec3( 0.0 ), ( 1.0 - fragCoordZ ) * darkness );');
  };
  csDepth.depthTest = false; csDepth.depthWrite = false;
  csHBlur = new THREE.ShaderMaterial(HorizontalBlurShader); csHBlur.depthTest = false;
  csVBlur = new THREE.ShaderMaterial(VerticalBlurShader); csVBlur.depthTest = false;
}
function blurContact(amount) {
  csBlurPlane.visible = true;
  csBlurPlane.material = csHBlur; csHBlur.uniforms.tDiffuse.value = csTarget.texture; csHBlur.uniforms.h.value = amount / 256;
  renderer.setRenderTarget(csBlur); renderer.render(csBlurPlane, csCamera);
  csBlurPlane.material = csVBlur; csVBlur.uniforms.tDiffuse.value = csBlur.texture; csVBlur.uniforms.v.value = amount / 256;
  renderer.setRenderTarget(csTarget); renderer.render(csBlurPlane, csCamera);
  csBlurPlane.visible = false;
}
function updateContactShadow() {
  csGroup.position.set(body.position.x, FLOOR_Y + 0.002, body.position.z);
  const bg = scene.background, alpha = renderer.getClearAlpha(), fog = scene.fog;
  const hide = [floor, marker, csPlane]; const was = hide.map((o) => o.visible);
  hide.forEach((o) => { o.visible = false; });
  scene.background = null; scene.fog = null; renderer.shadowMap.autoUpdate = false;
  scene.overrideMaterial = csDepth; renderer.setClearAlpha(0);
  renderer.setRenderTarget(csTarget); renderer.render(scene, csCamera);
  scene.overrideMaterial = null;
  blurContact(3.2); blurContact(1.2);
  renderer.setRenderTarget(null); renderer.setClearAlpha(alpha);
  scene.background = bg; scene.fog = fog; renderer.shadowMap.autoUpdate = true;
  hide.forEach((o, i) => { o.visible = was[i]; });
}

/* ------------------------------------------------------------------ *
 *  UI
 * ------------------------------------------------------------------ */
document.getElementById('btn-reset').addEventListener('click', () => {
  camera.position.copy(HOME.pos); controls.target.copy(HOME.target); controls.update();
});
document.getElementById('btn-drop').addEventListener('click', () => { if (body) dropSpecimen(); });
// a quick click (no drag) on the specimen nudges it
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = e.button === 0 ? { x: e.clientX, y: e.clientY, t: performance.now() } : null; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt || !shellMesh) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y), quick = performance.now() - downAt.t < 350;
  downAt = null;
  if (moved > 5 || !quick) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(shellMesh)[0];
  if (hit) pokeSpecimen(hit.point);
});
const spin = document.getElementById('btn-spin');
spin.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  spin.setAttribute('aria-pressed', String(controls.autoRotate));
});
let bgIdx = 0;
const bgBtn = document.getElementById('btn-bg');
bgBtn.addEventListener('click', () => {
  bgIdx = (bgIdx + 1) % BACKDROPS.length;
  backdrop = BACKDROPS[bgIdx];
  bgBtn.textContent = '桌面：' + backdrop.name;
  applyBackdrop();
});
document.getElementById('gloss').addEventListener('input', (e) => {
  const v = parseFloat(e.target.value);
  for (const m of mats) m.envMapIntensity = v;
});


// ---- light panel ----
const $ = (id) => document.getElementById(id);
const panel = $('lights'), lightsBtn = $('btn-lights');
function setPanel(open) { panel.hidden = !open; lightsBtn.setAttribute('aria-pressed', String(open)); }
setPanel(window.innerWidth > 640);
lightsBtn.addEventListener('click', () => setPanel(panel.hidden));

const swatches = [...panel.querySelectorAll('[data-preset]')];
function pickPreset(name) {
  L.color.set(PRESETS[name]);
  swatches.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.preset === name)));
  $('light-custom').value = '#' + L.color.getHexString();
  applyLight({ env: true });
}
swatches.forEach((b) => b.addEventListener('click', () => pickPreset(b.dataset.preset)));
$('light-custom').addEventListener('input', (e) => {
  L.color.set(e.target.value);
  swatches.forEach((b) => b.setAttribute('aria-pressed', 'false'));
  applyLight({ env: true });
});

const sliders = [
  ['az', 'light-az', 'out-az', (v) => v.toFixed(0) + '°'],
  ['el', 'light-el', 'out-el', (v) => v.toFixed(0) + '°'],
  ['dist', 'light-dist', 'out-dist', (v) => v.toFixed(1)],
  ['gain', 'light-gain', 'out-gain', (v) => v.toFixed(2) + '×'],
];
function syncSliders() {
  for (const [k, id, out, fmt] of sliders) { $(id).value = L[k]; $(out).textContent = fmt(L[k]); }
}
for (const [k, id, out, fmt] of sliders) {
  $(id).addEventListener('input', (e) => { L[k] = parseFloat(e.target.value); $(out).textContent = fmt(L[k]); applyLight(); });
}
$('light-show').addEventListener('change', (e) => { marker.visible = e.target.checked; });
$('light-orbit').addEventListener('change', (e) => { L.orbit = e.target.checked; });
$('light-reset').addEventListener('click', () => {
  Object.assign(L, LIGHT_HOME); $('light-orbit').checked = false; L.orbit = false;
  syncSliders(); pickPreset('natural');
});
syncSliders();

let lastT = performance.now(), contactDirty = 3, recentreLeft = 0;
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.1, ((now || performance.now()) - lastT) / 1000); lastT = now || performance.now();
  if (L.orbit) {
    L.az = ((L.az + 24 * dt + 180) % 360) - 180;
    $('light-az').value = L.az; $('out-az').textContent = L.az.toFixed(0) + '°';
    applyLight();
  }
  if (world) {
    stepPhysics(Math.min(dt, 0.05));
    if (!body.sleepState || body.sleepState === CANNON.Body.AWAKE || contactDirty-- > 0) updateContactShadow();
  }
  // once the specimen has come to rest, glide the view so it sits in the middle again (keeps the viewing angle)
  if (body && !recentred && body.sleepState === CANNON.Body.SLEEPING && !toppleIfStanding()) {
    recentre.set(body.position.x - controls.target.x, 0, body.position.z - controls.target.z);
    recentred = true; recentreLeft = 40;
  }
  if (recentreLeft > 0) {
    const d = recentre.clone().multiplyScalar(1 / recentreLeft--);
    camera.position.add(d); controls.target.add(d); recentre.sub(d);
  }
  if (floor) floor.visible = camera.position.y > floor.position.y + 0.005;
  controls.update(); renderer.render(scene, camera);
});

// let the loading label paint before the heavy texture pass
setTimeout(() => {
  build();
  document.getElementById('loading').classList.add('done');
  window.__ready = true;
}, 60);
window.__three = { THREE, camera, controls, renderer, scene, HOME, L, applyLight, get body() { return body; }, get world() { return world; }, toppleIfStanding, dropSpecimen, pokeSpecimen };
</script>
